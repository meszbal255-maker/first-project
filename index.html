<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude AI weblap</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            background-color: rgb(39, 39, 39);
        }
        h1{
            text-align: center;
            margin-top: 20px;
            color:#df9322;
        }
        .udvozlo {
            text-align: left;
            margin-top: 20px;
            color:#c0c0c0;
        }
        .felkover {
            font-weight: bold;
            color:#df2222;
        }
        p{
            font-size: 35px;
            color:#c0c0c0;
        }
        img{
            display: block;
            margin: 20px auto;
            border: 5px solid #df9322;
            block-size: 400px;
        }

    </style>
</head>
<body>
    <h1>Claude AI</h1>
    <p class="udvozlo">Üdvözöljük a Claude AI weblapján!</p>
    <p><span class="felkover">Szia!</span> Én egy középiskolás diák vagyok aki éppen egy Local Claude AI weboldalt akar csinálni helyi LLM-ekkel.</p>
    <p>Itt egy kép hogyan áll jelenleg a projekt: </p>
    <img src="Elsokep.png" alt="Claude AI kép" width="700" height="400">
</body>
</html>
